# Template for the user-level ~/.codex/config.toml.
# Project-local config is applied only when the repository is trusted.

model = "gpt-6-luna"
review_model = "gpt-6-luna"
service_tier = "default"

approval_policy = "on-request"
approvals_reviewer = "user"
sandbox_mode = "workspace-write"

web_search = "live"
personality = "pragmatic"

# Keep a conservative compaction trigger; GPT-6 Luna supports a much larger context window.
model_auto_compact_token_limit = 240000
model_auto_compact_token_limit_scope = "total"

[sandbox_workspace_write]
network_access = true

[agents]
enabled = true
default_subagent_model = "gpt-6-luna"
max_concurrent_threads_per_session = 2

# These entries enable installed plugins; they do not install missing bundles.
[plugins."github@openai-curated-remote"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."figma@openai-curated-remote"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = false
