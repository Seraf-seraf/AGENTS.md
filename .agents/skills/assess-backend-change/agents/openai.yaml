interface:
  display_name: "Оценка backend-изменения"
  short_description: "Необходимость, сложность и достаточные проверки"
  default_prompt: "Используй $assess-backend-change для оценки предложенного изменения. Отдели требуемый результат от способа реализации, сложность от риска и неизвестности. Выбери минимальное достаточное решение и проверки с учётом их стоимости и обязательных gates проекта. Не сокращай согласованный функционал, не меняй код и не обращайся к системам учёта работ."
