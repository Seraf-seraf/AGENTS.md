interface:
  display_name: "Проверка изменений"
  short_description: "Проверить поведение и найти подтверждённые ошибки"
  default_prompt: "Используй $verify-change для проверки только согласованного изменения. Для рефакторинга сравни поведение и контракты до и после. Выбери достаточную глубину по риску; проверь результат для потребителя и продолжение затронутого сценария после значимого отказа. Не меняй ожидания тестов под реализацию, не исправляй соседний код. Сообщи выполненные проверки, подтверждённые дефекты и ограничения."
