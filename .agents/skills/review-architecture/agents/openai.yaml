interface:
  display_name: "Проверка архитектуры"
  short_description: "Проверить границы компонентов и зависимости"
  default_prompt: "Используй $review-architecture для ревью только запрошенных границ и зависимостей. Учитывай принятые исключения. При влиянии решения на потребителей проверь границы отказа, необходимость ограничений и восстановление сценария, сохраняя обязательные инварианты. Выдай без дублей подтверждённые ошибки: место, правило, доказательство и минимальное исправление. Не меняй код; отсутствие замечаний допустимо."
