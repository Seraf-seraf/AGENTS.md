interface:
  display_name: "Проверка backend-архитектуры"
  short_description: "Ревью границ без недоказанных замечаний"
  default_prompt: "Используй $review-backend-architecture для ревью только запрошенных границ и зависимостей. Учитывай принятые исключения. Выдай без дублей подтверждённые ошибки: место, правило, доказательство и минимальное исправление. Не меняй код; отсутствие замечаний допустимо."
