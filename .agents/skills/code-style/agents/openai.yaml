interface:
  display_name: "Code Style"
  short_description: "Применить оформление и правила корректности языка"
  default_prompt: "Используй $code-style для генерации, изменения или проверки оформления и явно заданных языковых правил корректности кода в пределах поручения. Определи фактически затронутые языки, прочитай только соответствующие справочники. Приоритет: правила проекта, локальные дополнения справочника, явно указанный внешний источник. При отсутствии языкового файла не назначай стандарт автоматически; сообщи существенные ограничения проверки."
